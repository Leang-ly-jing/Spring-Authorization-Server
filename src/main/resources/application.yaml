spring:
  application:
    name: spring-authorization-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 9000

logging:
  level:
    org.springframework.security: trace